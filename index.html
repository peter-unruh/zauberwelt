<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zauberwelt</title>
<meta name="description" content="Eine bunte Spielwelt zum Antippen für kleine Kinder – ohne Text, ohne Werbung.">
<meta name="theme-color" content="#5B2EE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zauberwelt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#5B2EE0;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .grid{display:grid;grid-template-columns:repeat(4,auto);gap:clamp(14px,3.4vmin,36px);pointer-events:none}
  .tile{pointer-events:auto;width:min(19vw,34vh);aspect-ratio:1/1;border:0;padding:0;border-radius:30%;overflow:hidden;cursor:pointer;
    background:#fff;box-shadow:0 1vmin 0 rgba(40,10,90,.35),0 2.5vmin 5vmin rgba(40,10,90,.3);
    animation:bob 3.2s ease-in-out infinite;transition:scale .12s}
  .tile svg{width:100%;height:100%;display:block;pointer-events:none}
  .tile:active,.tile.press{scale:.9}
  .tile:nth-child(2){animation-delay:-.4s}.tile:nth-child(3){animation-delay:-.8s}.tile:nth-child(4){animation-delay:-1.2s}
  .tile:nth-child(5){animation-delay:-1.6s}.tile:nth-child(6){animation-delay:-2s}.tile:nth-child(7){animation-delay:-2.4s}.tile:nth-child(8){animation-delay:-2.8s}
  @keyframes bob{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -1.3vmin;rotate:2deg}}
  @media (orientation:portrait){.grid{grid-template-columns:repeat(2,auto)}.tile{width:min(37vw,19vh)}}
  .ctl{position:fixed;z-index:5;width:54px;height:54px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.88);
    display:grid;place-items:center;box-shadow:0 4px 0 rgba(40,10,90,.25);cursor:pointer;transition:scale .1s}
  .ctl:active{scale:.88}
  #home{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left))}
  #snd{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
  #fs{top:calc(12px + env(safe-area-inset-top));right:calc(78px + env(safe-area-inset-right))}
  .hide{display:none!important}
  #fade{position:fixed;inset:0;z-index:9;background:#EDE4FF;opacity:0;pointer-events:none;transition:opacity .2s}
  #fade.on{opacity:1}
  #snd.inworld,#fs.inworld{opacity:.55;width:46px;height:46px}
  #fs.inworld{right:calc(68px + env(safe-area-inset-right))}
  #snd .dots,#fs .dots{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:18px;font-weight:bold;line-height:1;color:#5B2EE0;text-shadow:0 0 3px #fff,0 0 3px #fff;letter-spacing:2px;pointer-events:none}
  .ctl{position:fixed}
  .wig{animation:wig .3s}
  @keyframes wig{0%,100%{rotate:0deg}30%{rotate:-14deg}70%{rotate:14deg}}
  .tile.spin{animation:spin .9s ease-in-out}
  @keyframes spin{0%{rotate:0deg;scale:1}50%{scale:1.15}100%{rotate:360deg;scale:1}}
</style>
</head>

<script>
'use strict';
/* Zauberwelt – Grundlagen: Helfer, Zeichnen, Partikel, Effekte, Kamera, Gesten */

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1,T=0;
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const hsl=(h,s=90,l=60,a=1)=>`hsla(${Math.round(h)},${s}%,${l}%,${a})`;
const easeOutBack=k=>1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2);
const RAINBOW=[0,28,50,120,175,210,265,320];
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
let lastInput=performance.now();
const idleTime=()=>(performance.now()-lastInput)/1000;
const blinkAt=(t,seed)=>((t+seed*1.7)%3.7)<.13;
const MONTH=new Date().getMonth()+1;
const isNight=()=>{ const h=new Date().getHours(); return h>=19||h<6; };
const SEASON=MONTH>=11||MONTH<=2?'winter':MONTH<=5?'spring':MONTH<=8?'summer':'autumn';

/* ---------- Zeichen-Helfer ---------- */
function rr(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function starPath(c,x,y,r,n=5,ir=.5,rot=-Math.PI/2){ c.beginPath(); for(let i=0;i<n*2;i++){ const q=i%2?r*ir:r,a=rot+i*Math.PI/n; c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);} c.closePath(); }
function heartPath(c,x,y,s){ c.beginPath(); c.moveTo(x,y+s*.75); c.bezierCurveTo(x-s*1.3,y-s*.1,x-s*.6,y-s*1.1,x,y-s*.4); c.bezierCurveTo(x+s*.6,y-s*1.1,x+s*1.3,y-s*.1,x,y+s*.75); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,Math.max(0,r),0,TAU); }
function puffs(c,x,y,s,list){ c.beginPath(); for(const [dx,dy,r] of list){ c.moveTo(x+dx*s+r*s,y+dy*s); c.arc(x+dx*s,y+dy*s,r*s,0,TAU); } }
const emoCache=new Map();
function emoji(c,ch,x,y,size){
  if(size<2) return;
  const b=Math.max(16,Math.round(size/12)*12), key=ch+'|'+b; let e=emoCache.get(key);
  if(!e){ e=document.createElement('canvas'); const px=Math.ceil(b*1.4*Math.min(2,Math.max(1,DPR))); e.width=e.height=px;
    const g=e.getContext('2d'); g.font=`${Math.round(px/1.4)}px ${EMOJI_FONT}`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#000'; g.fillText(ch,px/2,px/2*1.06);
    emoCache.set(key,e); if(emoCache.size>220) emoCache.delete(emoCache.keys().next().value); }
  const s=size*1.4; c.drawImage(e,x-s/2,y-s/2,s,s);
}
function face(c,x,y,r,o={}){
  const ex=r*.36,ey=-r*.08,er=r*.14,ink='#2b1d3a',lx=o.lx||0,ly=o.ly||0;
  for(const s of [-1,1]){
    const ox=x+s*ex,oy=y+ey;

    addP(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.6,1.2),size:U*rand(.8,1.4),color:o.hue!=null?hsl(o.hue+rand(-15,15),95,62):hsl(rand(0,360),95,62),kind:'star',vr:rand(-5,5)},o.p||{})); }

const Cam={

/* ---------- Gesten-Erkennung ---------- */
function circleOf(path){
  if(path.length<14) return null;
  let cx=0,cy=0; for(const p of path){ cx+=p.x; cy+=p.y; } cx/=path.length; cy/=path.length;
  let r=0; for(const p of path) r+=dist(p.x,p.y,cx,cy); r/=path.length;
  if(r<U*6) return null;
  let dev=0; for(const p of path) dev+=Math.abs(dist(p.x,p.y,cx,cy)-r); dev/=path.length;
  if(dev>r*.38) return null;
  let ang=0; for(let i=1;i<path.length;i++){ let d=Math.atan2(path[i].y-cy,path[i].x-cx)-Math.atan2(path[i-1].y-cy,path[i-1].x-cx); if(d>Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU; ang+=d; }
  if(Math.abs(ang)<TAU*.8) return null;
  return {x:cx,y:cy,r};
}

  brass(f,t,v=1,d,dur=.3){ tone(f,t,{type:'sawtooth',hold:dur,rel:.12,vol:.09*v,attack:.03,filter:'lowpass',ff:f*1.2,ff2:f*5,ffT:.08,q:2,dest:d}); tone(f*1.003,t,{type:'sawtooth',hold:dur,rel:.12,vol:.05*v,attack:.03,filter:'lowpass',ff:f*3,dest:d}); },
  flute(f,t,v=1,d,dur=.45){ tone(f,t,{hold:dur,rel:.15,vol:.14*v,attack:.06,vib:5,vibAmt:.012,vibDelay:.15,dest:d}); noise(t,{type:'bandpass',f:f*2,q:3,dur:dur*.6,vol:.03*v,attack:.04,dest:d}); },
  voice(f,t,v=1,d,dur=.55,vw='a',vw2){ const c=A.ctx,os=c.createOscillator(); os.type='sawtooth'; os.frequency.setValueAtTime(f,t);
    const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=5.3; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(f*.016,t+.3); l.connect(lg); lg.connect(os.frequency);
    const g=c.createGain(),end=t+dur+.3; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2*v,t+.06); g.gain.setValueAtTime(.2*v,t+dur); g.gain.exponentialRampToValueAtTime(.0001,end);
    const F=VOW[vw]||VOW.a,F2=vw2?VOW[vw2]:null;
    [1,.55,.22].forEach((amp,k)=>{ const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=8; bp.frequency.setValueAtTime(F[k],t); if(F2) bp.frequency.linearRampToValueAtTime(F2[k],t+dur);
      const gg=c.createGain(); gg.gain.value=amp*3.2; os.connect(bp); bp.connect(gg); gg.connect(g); });
    g.connect(d||A.sfxDest); os.start(t); os.stop(end+.05); l.start(t); l.stop(end+.05); },
  celesta(f,t,v=1,d){ tone(f*2,t,{dur:1.2,vol:.14*v,attack:.002,dest:d}); tone(f*4,t,{dur:.3,vol:.04*v,dest:d}); },
  synth(f,t,v=1,d,dur=.2){ tone(f,t,{type:'sawtooth',hold:dur*.3,rel:dur,vol:.06*v,filter:'lowpass',ff:f*8,ff2:f*1.5,ffT:dur,q:6,dest:d}); },
  pad(f,t,v=1,d,dur=2){ [-8,8].forEach(dt=>tone(f,t,{type:'sawtooth',hold:dur,rel:1,vol:.035*v,attack:.6,detune:dt,filter:'lowpass',ff:900,dest:d})); },
  bass(f,t,v=1,d,dur=.3){ tone(f,t,{type:'triangle',hold:dur,rel:.08,vol:.3*v,attack:.01,dest:d}); tone(f*.5,t,{hold:dur,rel:.08,vol:.18*v,attack:.01,dest:d}); },
  tuba(f,t,v=1,d,dur=.22){ tone(f,t,{type:'sawtooth',hold:dur,rel:.08,vol:.12*v,attack:.02,filter:'lowpass',ff:f*2.5,q:1.5,dest:d}); tone(f,t,{hold:dur,rel:.08,vol:.15*v,dest:d}); },
  kick(f,t,v=1,d){ tone(150,t,{slide:.28,slideT:.12,dur:.35,vol:.5*v,dest:d}); },
  snare(f,t,v=1,d){ noise(t,{type:'highpass',f:1800,dur:.16,vol:.22*v,dest:d}); tone(200,t,{slide:.7,dur:.08,vol:.12*v,dest:d}); },
  hat(f,t,v=1,d){ noise(t,{type:'highpass',f:7500,dur:.05,vol:.1*v,dest:d}); },

  shaker(f,t,v=1,d){ noise(t,{type:'highpass',f:5500,dur:.07,vol:.11*v,attack:.02,dest:d}); },
  brush(f,t,v=1,d){ noise(t,{type:'bandpass',f:3500,q:.8,dur:.2,vol:.08*v,attack:.02,dest:d}); },
  wood(f,t,v=1,d){ tone(f||900,t,{dur:.07,vol:.3*v,attack:.001,dest:d}); tone((f||900)*2.5,t,{dur:.03,vol:.1*v,dest:d}); },
  tri(f,t,v=1,d){ tone(f*4,t,{dur:1.4,vol:.08*v,attack:.001,dest:d}); tone(f*5.3,t,{dur:.7,vol:.04*v,dest:d}); },

  crackle(f,t,v=1,d){ noise(t,{type:'highpass',f:2500,dur:.006,vol:.05*v,attack:.001,dest:d}); }
};

/* ---------- Musik-Sequencer ---------- */
function dg(th,deg,oct=0){ const sc=SCALES[th.scale],n=sc.length,o=Math.floor(deg/n),k=((deg%n)+n)%n; return mtof(th.key+12*(o+oct)+sc[k]); }
function ct(th,r,i,oct=0){ const tones=th.sev?[0,2,4,6]:[0,2,4],m=tones.length,k=Math.floor(i/m),j=((i%m)+m)%m; return dg(th,r+tones[j]+k*SCALES[th.scale].length,oct); }
const Mu={
  th:null,name:'',step:0,next:0,bar:0,override:null,overrideEnd:0,timer:null,groove:0,
  boot(){ if(this.timer) return; this.timer=setInterval(()=>this.tick(),25); },
  set(name){ if(name===this.name) return; this.name=name; this.th=THEMES[name]; this.step=0; if(A.ctx) this.next=A.ctx.currentTime+.08; },
  cur(){ return this.override||this.th||THEMES.menu; },
  disco(sec){ this.override=THEMES.disco; this.overrideEnd=performance.now()+sec*1000; this.step=0; if(A.ctx) this.next=A.ctx.currentTime+.05; },
  tick(){
    if(this.override&&performance.now()>this.overrideEnd){ this.override=null; this.step=0; }
    if(!A.ctx||A.ctx.state!=='running') return;
    const th=this.cur(),spb=60/th.bpm/4,steps=th.steps||16,now=A.ctx.currentTime;
    if(this.next<now-.25) this.next=now+.05;
    while(this.next<now+.12){
      const st=this.step,bar=Math.floor(st/steps),s=st%steps; this.bar=bar;
      if(A.mode===0){ try{ th.play(s,bar,this.next,spb,A.musDest); }catch(e){} }
      this.step++; const sw=th.swing||0; this.next+=spb*(sw?(s%2===0?1+sw:1-sw):1);
    }
  },
  root(){ const th=this.cur(); return th.prog[this.bar%th.prog.length]; },
  ct(i,oct=0){ return ct(this.cur(),this.root(),i,oct); },
  sc(i,oct=0){ return dg(this.cur(),this.root()+i,oct); }
};
const R=(p)=>Math.random()<p;
const THEMES={
  menu:{bpm:96,key:60,scale:'major',prog:[0,4,5,3],
    play(s,b,t,spb,d){ const r=this.prog[b%4]; if(s%2===0) INST.box(ct(this,r,[0,1,2,1,3,2,1,2][(s/2)%8],0),t,.45,d);
      if(s===0||s===8) INST.bass(dg(this,r,-1),t,.35,d,spb*6); if(s%4===2) INST.shaker(0,t,.5,d); }},
  sky:{bpm:68,key:65,scale:'major',prog:[0,5,3,4],
    play(s,b,t,spb,d){ const r=this.prog[b%4]; if(s%2===0) INST.celesta(ct(this,r,[0,2,1,2,3,2,1,2][(s/2)%8],0),t,.55,d);
      if(s===0){ [0,1,2].forEach(i=>INST.pad(ct(this,r,i,-1),t,.6,d,spb*14)); INST.bass(dg(this,r,-2),t,.3,d,spb*10); } }},
  sea:{bpm:76,key:62,scale:'dorian',prog:[0,3,0,6],
    play(s,b,t,spb,d){ const r=this.prog[b%4];
      if(s===0){ [0,1,2].forEach(i=>INST.pad(ct(this,r,i,-1),t,.8,d,spb*14)); }
      if(s===0||s===10) INST.bass(dg(this,r,-2),t,.35,d,spb*3);
      if(s%2===0&&R(.3)) INST.kalimba(ct(this,r,rint(0,5),0),t,.45,d);
      if(s===6&&R(.3)) for(let k=0;k<4;k++) INST.glass(ct(this,r,k+3,0),t+k*.06,.25,d); }},
  meadow:{bpm:108,key:67,scale:'major',prog:[0,3,0,4],
    play(s,b,t,spb,d){ const r=this.prog[b%4];
      if(s===0||s===6||s===8||s===12) [0,1,2,3].forEach((i,k)=>INST.pluck(ct(this,r,i,-1),t+k*.018,.38,d));
      if(s===0||s===8) INST.pluck(dg(this,r,-2),t,.5,d); if(s===12) INST.pluck(ct(this,r,2,-2),t,.45,d);
      if(s%4===2) INST.shaker(0,t,.6,d);
      if(b%2===1&&s%4===0&&R(.6)) INST.flute(ct(this,r,rint(1,5),0),t,.55,d,spb*2.5); }},
  music:{bpm:100,key:60,scale:'major',prog:[0,5,3,4],
    play(s,b,t,spb,d){ const r=this.prog[b%4],g=Mu.groove; const bs=dg(this,r,-1);
      if(g===0){ if(s===0||s===8) INST.kick(0,t,.6,d); if(s%4===2) INST.shaker(0,t,.5,d); if(s===0||s===8) INST.bass(bs,t,.4,d,spb*3); }
      else if(g===1){ if(s===0||s===6||s===8) INST.kick(0,t,.8,d); if(s===4||s===12) INST.snare(0,t,.7,d); if(s%2===0) INST.hat(0,t,.6,d);
        if([0,3,8,11].includes(s)) INST.bass(s%8===3?dg(this,r+4,-1):bs,t,.45,d,spb*1.5); if(s===0) [0,1,2].forEach(i=>INST.pad(ct(this,r,i,-1),t,.45,d,spb*14)); }
      else if(g===2){ if(s===8) { INST.kick(0,t,.8,d); INST.snare(0,t,.5,d); } if(s===4||s===12) [0,1,2].forEach(i=>INST.organ(ct(this,r,i,0),t,.45,d,spb*.8));
        if(s%2===1) INST.hat(0,t,.4,d); if([0,3,6,10].includes(s)) INST.bass(s===6?dg(this,r+2,-1):bs,t,.5,d,spb*1.8); }
      else if(g===3){ if(s%4===0) INST.kick(0,t,.9,d); if(s===4||s===12) INST.clap(0,t,.7,d); if(s%4===2) INST.ohat(0,t,.6,d);
        if(s%2===0) INST.bass(s%4===0?bs:bs*2,t,.4,d,spb*.8); if(s===0||s===6) [0,1,2].forEach(i=>INST.brass(ct(this,r,i,0),t,.35,d,spb)); }
      else if(g===4){ if(s===0||s===8) INST.tuba(dg(this,r,-1),t,.7,d); if(s===4||s===12) [0,1,2].forEach(i=>INST.brass(ct(this,r,i,0),t,.3,d,spb*.6));
        if(s%2===0||s>=13) INST.snare(0,t,s%4===0?.5:.25,d); } }},
  paint:{bpm:74,key:63,scale:'major',prog:[3,2,1,0],sev:true,swing:.16,
    play(s,b,t,spb,d){ const r=this.prog[b%4];
      if(s===0||s===10) [0,1,2,3].forEach((i,k)=>INST.epiano(ct(this,r,i,-1),t+k*.012,s?.25:.4,d));
      if(s===0||s===7||s===10) INST.kick(0,t,.55,d); if(s===4||s===12) INST.brush(0,t,1,d); if(s%2===0) INST.hat(0,t,s%4?.25:.45,d);
      if(s===0||s===7) INST.bass(dg(this,r,-2),t,.45,d,spb*2.5); if(R(.25)) INST.crackle(0,t+Math.random()*spb,1,d);
      if(b%2===1&&s%4===2&&R(.5)) INST.glass(ct(this,r,rint(2,6),0),t,.25,d); }},
  balloons:{bpm:140,key:60,scale:'major',steps:12,prog:[0,4,4,0,3,0,4,0],
    play(s,b,t,spb,d){ const r=this.prog[b%8];
      if(s===0) INST.tuba(b%2?ct(this,r,2,-2):dg(this,r,-2),t,.8,d); if(s===4||s===8) [0,1,2].forEach(i=>INST.organ(ct(this,r,i,0),t,.4,d,spb*1.5));
      if(s===0&&R(.6)) INST.box(ct(this,r,rint(3,6),0),t,.5,d); if(s===6&&R(.4)) INST.box(ct(this,r,rint(3,6),0),t,.4,d); }},
  space:{bpm:90,key:57,scale:'minor',prog:[0,5,2,6],
    play(s,b,t,spb,d){ const r=this.prog[b%4];
      INST.synth(ct(this,r,[0,1,2,3,4,3,2,1][s%8],0),t,s%4===0?.7:.45,d,spb*1.5);
      if(s===0){ [0,1,2].forEach(i=>INST.pad(ct(this,r,i,-1),t,.7,d,spb*14)); }
      if(s===0||s===8) INST.bass(dg(this,r,-2),t,.45,d,spb*4); }},
  shapes:{bpm:114,key:64,scale:'dorian',prog:[0,0,3,3],
    play(s,b,t,spb,d){ const r=this.prog[b%4],bs=dg(this,r,-2);
      if([0,3,6,8,10,14].includes(s)) INST.pluck(s===6||s===14?bs*2:bs,t,.6,d);
      if(s===0||s===8||s===11) INST.kick(0,t,.6,d); if(s===4||s===12) INST.clap(0,t,.55,d); if(s%2===1) INST.hat(0,t,.35,d);
      if(s===2&&R(.5)) INST.wood(rand(700,1100),t,.4,d); if(b%2===1&&s===14) INST.chip(ct(this,r,rint(2,5),0),t,.5,d); }},
  disco:{bpm:122,key:57,scale:'minor',prog:[0,3,6,4],
    play(s,b,t,spb,d){ const r=this.prog[b%4],bs=dg(this,r,-1);
      if(s%4===0) INST.kick(0,t,1,d); if(s===4||s===12) INST.clap(0,t,.8,d); if(s%4===2) INST.ohat(0,t,.8,d); else INST.hat(0,t,.3,d);
      INST.bass(s%2?bs*2:bs,t,.45,d,spb*.6);
      if(s===0||s===3||s===10) [0,1,2].forEach(i=>INST.brass(ct(this,r,i,0),t,.45,d,spb*.8));
      if(s===14&&R(.5)) for(let k=0;k<4;k++) INST.celesta(ct(this,r,k+3,0),t+k*.05,.4,d); }}
};

/* ---------- Gehaltene Klänge (zum Gedrückthalten) ---------- */
function sus(kind,f=300){
  const off={set(){},stop(){}};
  if(!A.ctx||A.mode===2) return off;
  try{
    const c=A.ctx,t=c.currentTime,g=c.createGain(); g.gain.setValueAtTime(.0001,t);
    const nodes=[]; let main;
    if(kind==='rumble'){ const s=c.createBufferSource(); s.buffer=A.noiseBuf; s.loop=true; const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=f; fl.Q.value=4; s.connect(fl); fl.connect(g); s.start(t); nodes.push(s); main={freq:fl.frequency};
      const o=c.createOscillator(); o.frequency.value=45; o.connect(g); o.start(t); nodes.push(o); g.gain.exponentialRampToValueAtTime(.25,t+.4); }
    else if(kind==='swirl'){ const s=c.createBufferSource(); s.buffer=A.noiseBuf; s.loop=true; const fl=c.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=f; fl.Q.value=3;
      const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=3; lg.gain.value=f*.5; l.connect(lg); lg.connect(fl.frequency); l.start(t); nodes.push(l); s.connect(fl); fl.connect(g); s.start(t); nodes.push(s); main={freq:fl.frequency,lfo:l.frequency}; g.gain.exponentialRampToValueAtTime(.2,t+.3); }
    else { const o=c.createOscillator(); o.type=kind==='squeak'?'triangle':kind==='organ'?'triangle':'sine'; o.frequency.value=f;
      const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=kind==='squeak'?9:5.5; lg.gain.value=f*.02; l.connect(lg); lg.connect(o.frequency); l.start(t); nodes.push(l);
      o.connect(g); o.start(t); nodes.push(o); main={freq:o.frequency};
      if(kind==='organ'){ const o2=c.createOscillator(); o2.frequency.value=f*2; const g2=c.createGain(); g2.gain.value=.4; o2.connect(g2); g2.connect(g); o2.start(t); nodes.push(o2); main.f2=o2.frequency; }
      g.gain.exponentialRampToValueAtTime(kind==='whistle'?.05:kind==='squeak'?.08:.13,t+.08); }
    g.connect(kind==='organ'?A.sfxWet:A.sfxDest);
    return {
      set(nf){ const n=c.currentTime; main.freq.setTargetAtTime(nf,n,.05); if(main.f2) main.f2.setTargetAtTime(nf*2,n,.05); if(main.lfo) main.lfo.setTargetAtTime(2+nf/400,n,.1); },
      stop(rel=.2){ const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(.0001,g.gain.value),n); g.gain.exponentialRampToValueAtTime(.0001,n+rel); nodes.forEach(x=>{ try{ x.stop(n+rel+.05); }catch(_){} }); }
    };
  }catch(e){ return off; }
}

worlds.menu={

  enter(){ this.bl=[]; for(let i=0;i<18;i++) this.bl.push({x:rand(0,W),y:rand(0,H),r:U*rand(3,10),vx:rand(-4,4)*U,vy:rand(-4,4)*U,k:rint(0,2),rot:rand(0,TAU),pop:0});
    this.night=isNight(); this.fall=[]; this.stars=[]; for(let i=0;i<60;i++) this.stars.push({x:rand(0,W),y:rand(0,H*.7),r:rand(.15,.4)*U,ph:rand(0,TAU)}); },
  update(dt,t){
    for(const b of this.bl){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=dt*.3; b.pop=Math.max(0,b.pop-dt*2);
      if(b.x<-b.r) b.x=W+b.r; if(b.x>W+b.r) b.x=-b.r; if(b.y<-b.r) b.y=H+b.r; if(b.y>H+b.r) b.y=-b.r; }

    for(let i=this.fall.length-1;i>=0;i--){ const f=this.fall[i]; f.y+=f.vy*dt; f.x+=Math.sin(t+f.ph)*U*3*dt; f.rot+=dt; if(f.y>H+U*3) this.fall.splice(i,1); }
  },
  draw(c,t){

    else { g.addColorStop(0,'#5B2EE0'); g.addColorStop(.55,'#B832D9'); g.addColorStop(1,'#FF6FA5'); }
    c.fillStyle=g; c.fillRect(0,0,W,H);
    if(this.night){ c.fillStyle='#fff'; for(const s of this.stars){ c.globalAlpha=.3+.7*Math.abs(Math.sin(t*1.5+s.ph)); circ(c,s.x,s.y,s.r); c.fill(); } c.globalAlpha=1;
      c.fillStyle='#FFF1A8'; circ(c,W*.08,H*.85,U*6); c.fill(); face(c,W*.08,H*.85,U*4.6,{sleep:true}); }
    for(const b of this.bl){ c.fillStyle=`rgba(255,255,255,${.13+b.pop*.4})`; const r=b.r*(1+b.pop*.5);
      if(b.k===0){ circ(c,b.x,b.y,r); c.fill(); } else if(b.k===1){ starPath(c,b.x,b.y,r,5,.5,b.rot); c.fill(); } else { heartPath(c,b.x,b.y,r*.8); c.fill(); } }

      else if(SEASON==='spring'){ c.fillStyle='rgba(255,182,213,.9)'; c.save(); c.translate(f.x,f.y); c.rotate(f.rot); c.beginPath(); c.ellipse(0,0,f.r*1.4,f.r*.8,0,0,TAU); c.fill(); c.restore(); }

      else { c.fillStyle='rgba(255,255,200,.7)'; circ(c,f.x,f.y,f.r*.7); c.fill(); }

    c.globalAlpha=a; ['#FF4D4D','#FF9F1C','#FFE14D','#5BD55B','#3EC6FF','#4D6BFF','#B04DFF'].forEach((col,i)=>{ c.strokeStyle=col; c.lineWidth=bw+1; c.beginPath(); c.arc(W/2,H*.95,R-i*bw,Math.PI,0); c.stroke(); }); c.globalAlpha=1; }
  if(Glob.disco>0){ Glob.disco-=dt; const a=Math.min(1,Glob.disco,(12-Glob.disco)*2);
    c.save(); c.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){ const ang=Math.sin(t*1.7+i*1.1)*.7; c.save(); c.translate(W/2,H*.06); c.rotate(ang+(i-2.5)*.35); const g=c.createLinearGradient(0,0,0,H*1.1); g.addColorStop(0,hsl(i*60+t*120,100,60,.5*a)); g.addColorStop(1,hsl(i*60,100,60,0));
      c.fillStyle=g; c.beginPath(); c.moveTo(-U,0); c.lineTo(U,0); c.lineTo(U*16,H*1.1); c.lineTo(-U*16,H*1.1); c.fill(); c.restore(); }
    c.fillStyle=hsl(t*200,100,50,.12*a); c.fillRect(0,0,W,H); c.restore();
    const r=U*7,y=H*.06+Math.min(1,(12-Glob.disco)*2)*U*4; c.globalAlpha=a; c.strokeStyle='#ccc'; c.lineWidth=2; c.beginPath(); c.moveTo(W/2,0); c.lineTo(W/2,y-r); c.stroke();
    c.save(); c.beginPath(); c.arc(W/2,y,r,0,TAU); c.clip(); c.fillStyle='#b9bdd0'; c.fillRect(W/2-r,y-r,r*2,r*2);
    for(let i=-4;i<=4;i++) for(let j=-4;j<=4;j++){ c.fillStyle=hsl((i*40+j*70+t*300)%360,60,(i+j+Math.floor(t*6))%3?85:60); c.fillRect(W/2+i*r*.25+((t*20)%1)*r*.25-r*.12,y+j*r*.25-r*.12,r*.22,r*.22); }
    c.restore(); c.globalAlpha=1;
    if(Math.random()<.3) addP({x:rand(0,W),y:rand(0,H),life:.4,size:U*rand(.6,1.2),color:'#fff',kind:'star',add:true}); }
}

/* ---------- Welt wechseln ---------- */
function go(name){

  setTimeout(()=>{ if(cur&&cur.leave) cur.leave(); Cam.stop(); P.length=0; Vis.v=null;
    cur=worlds[name]; curName=name; cur.enter(); lastInput=performance.now(); ptrs.clear();
    const m=name==='menu'; menuEl.classList.toggle('hide',!m); homeBtn.classList.toggle('hide',m); fsBtn.classList.toggle('hide',!fsSupported); sndBtn.classList.toggle('inworld',!m); fsBtn.classList.toggle('inworld',!m);
    fade.classList.remove('on'); },220);
}
const JINGLE={sky:()=>S.arp('celesta',5,0,.1),sea:()=>{ S.blub(2); S.ct('kalimba',2,0,.8,.15); },meadow:()=>S.tweet(),music:()=>S.arp('xylo',4,0,.08),
  paint:()=>S.arp('epiano',4,0,.06),balloons:()=>{ S.pop(); S.ct('box',2,0); },space:()=>S.theremin(true),shapes:()=>S.boing()};

/* ---------- Bildschirmgröße ---------- */
function resize(){
  const oW=W,oH=H; W=innerWidth; H=innerHeight; DPR=Math.min(2,window.devicePixelRatio||1); U=Math.min(W,H)/100;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  if(!cur||!oW) return;
  const big=Math.abs(W-oW)/oW>.12||Math.abs(H-oH)/oH>.12||((W>H)!==(oW>oH));
  if(big){ if(cur.leave) cur.leave(); cur.enter(); } else if(cur.relayout) cur.relayout();
}
addEventListener('resize',resize);

/* ---------- Eingabe & Gesten ---------- */
const ptrs=new Map(); const tapHist={x:0,y:0,t:0,n:0}; let corners=[],multiFired=false;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); A.init(); lastInput=performance.now();
  const x=e.clientX,y=e.clientY,now=performance.now();
  const rec={x,y,sx:x,sy:y,t0:now,path:[{x,y,t:now}],moved:0,held:false,noHold:false,vis:false}; ptrs.set(e.pointerId,rec);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(now-tapHist.t<450&&dist(x,y,tapHist.x,tapHist.y)<U*9) tapHist.n++; else tapHist.n=1; tapHist.x=x; tapHist.y=y; tapHist.t=now; const n=tapHist.n;
  const cn=y>H-U*16?(x<U*16?0:x>W-U*16?1:-1):-1;
  if(cn>=0){ corners.push({c:cn,t:now}); corners=corners.filter(q=>now-q.t<3500).slice(-4); if(corners.length===4&&corners.map(q=>q.c).join('')==='0101'){ corners=[]; startDisco(); } }
  if(ptrs.size>=4) startDisco();
  else if(ptrs.size===3&&!multiFired){ multiFired=true; if(cur.multi) cur.multi(); else confettiRain(60); }
  if(Vis.hit(x,y)){ rec.vis=true; return; }
  if(curName!=='menu'){ taps++; if(taps>=nextSurprise&&!Vis.v){ taps=0; nextSurprise=rint(20,35); Vis.start(); } }
  if(cur.down) cur.down(e.pointerId,x,y,n); else if(cur.tap) cur.tap(x,y,n);
},{passive:false});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return; e.preventDefault(); lastInput=performance.now();
  const x=e.clientX,y=e.clientY,dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy); p.x=x; p.y=y; p.moved+=d; if(p.moved>U*3) p.noHold=true;
  if(d>2){ p.path.push({x,y,t:performance.now()}); if(p.path.length>300) p.path.shift(); }
  if(p.vis) return;
  if(cur.move) cur.move(e.pointerId,x,y,dx,dy); else if(cur.drag) cur.drag(x,y,dx,dy);
},{passive:false});
const endPtr=e=>{ const p=ptrs.get(e.pointerId); if(!p) return; ptrs.delete(e.pointerId); if(ptrs.size===0) multiFired=false;
  const x=e.clientX,y=e.clientY,now=performance.now();
  if(p.vis) return;
  if(p.held&&cur.holdEnd) cur.holdEnd(e.pointerId,x,y,(now-p.t0)/1000);
  if(!p.held&&e.type==='pointerup'){
    const c=circleOf(p.path); if(c&&cur.circle) cur.circle(c);
    else { let q=p.path[0]; for(let i=p.path.length-1;i>=0;i--){ if(now-p.path[i].t>110){ q=p.path[i]; break; } }
      const dt=Math.max(.016,(now-q.t)/1000),vx=(x-q.x)/dt,vy=(y-q.y)/dt;
      if(Math.hypot(vx,vy)>U*320&&p.moved>U*15&&cur.swipe) cur.swipe(vx,vy,x,y); } }
  if(cur.up) cur.up(e.pointerId,x,y);
};
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
function checkHolds(dt){ const now=performance.now();
  for(const [id,p] of ptrs){ if(p.vis) continue;
    if(!p.held&&!p.noHold&&now-p.t0>550){ p.held=true; vibrate(15); if(cur.hold) cur.hold(id,p.x,p.y); }
    if(p.held&&cur.holding) cur.holding(id,p.x,p.y,(now-p.t0)/1000,dt); } }
for(const ev of ['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu']) document.addEventListener(ev,e=>{ if(e.target.closest&&e.target.closest('button')&&ev!=='contextmenu') return; e.preventDefault(); },{passive:false});
document.addEventListener('pointerdown',()=>A.init(),true);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&A.ctx&&A.ctx.state==='running') A.ctx.suspend(); });

/* ---------- Bewegungssensoren (Kippen & Schütteln) ---------- */
TILT.need=()=>{ TILT.need=null; const ask=E=>E&&typeof E.requestPermission==='function'?E.requestPermission().catch(()=>{}):null; ask(window.DeviceOrientationEvent); ask(window.DeviceMotionEvent); };
addEventListener('deviceorientation',e=>{ if(e.beta==null||e.gamma==null) return;
  const ang=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180,gx=Math.sin(e.gamma*Math.PI/180),gy=Math.sin(e.beta*Math.PI/180);
  const x=gx*Math.cos(ang)+gy*Math.sin(ang),y=-gx*Math.sin(ang)+gy*Math.cos(ang),m=Math.hypot(x,y);
  if(m<.25){ TILT.ok=false; return; } TILT.x=x/m; TILT.y=y/m; TILT.ok=true; TILT.t=performance.now(); });
let lastShake=0;
addEventListener('devicemotion',e=>{ const a=e.accelerationIncludingGravity; if(!a||a.x==null) return; const m=Math.hypot(a.x,a.y,a.z);
  if(m>26&&performance.now()-lastShake>1500&&cur){ lastShake=performance.now(); vibrate(40); if(cur.shake) cur.shake(); else confettiRain(50); } });

/* ---------- Menü-Kacheln (lange drücken = Vorschau-Wackeln) ---------- */
document.querySelectorAll('.tile').forEach(b=>{
  let timer=null,long=false;
  b.addEventListener('pointerdown',()=>{ A.init(); long=false; timer=setTimeout(()=>{ long=true; b.classList.add('spin'); JINGLE[b.dataset.w](); setTimeout(()=>b.classList.remove('spin'),900); },550); });
  const clear=()=>clearTimeout(timer); b.addEventListener('pointerup',clear); b.addEventListener('pointerleave',clear); b.addEventListener('pointercancel',clear);
  b.addEventListener('click',()=>{ if(long){ long=false; return; } JINGLE[b.dataset.w](); b.classList.add('press'); setTimeout(()=>b.classList.remove('press'),200); go(b.dataset.w); });
});
homeBtn.addEventListener('click',()=>{ A.init(); S.slide(false); go('menu'); });

/* ---------- Ton-Knopf: im Menü 1x, in den Welten 3x tippen ---------- */

    if(n<need){ dots.textContent='•'.repeat(n)+'◦'.repeat(need-n); btn.classList.remove('wig'); void btn.offsetWidth; btn.classList.add('wig'); return; }
    n=0; dots.textContent=''; action(); });
}
parentButton(sndBtn,sndDots,()=>{ A.setMode((A.mode+1)%3); try{ localStorage.setItem('zw-sound',A.mode); }catch(_){} showSnd(); if(A.mode<2) S.ct('celesta',0,0); });
const fsSupported=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);

/* ---------- Hinweis-Finger ---------- */
function drawHint(c,t){ const idle=idleTime(); if(curName==='menu'||idle<7||!cur.hint||ptrs.size) return;
  const [x,y]=cur.hint(),a=Math.min(1,idle-7); c.strokeStyle=hsl((t*120)%360,95,62); c.lineWidth=U*.8;
  for(let i=0;i<3;i++){ const ph=(t*.8+i/3)%1; c.globalAlpha=a*(1-ph)*.8; circ(c,x,y,U*3+ph*U*10); c.stroke(); }
  c.globalAlpha=a; emoji(c,'👆',x+U*2.5,y+U*6.5+Math.abs(Math.sin(t*3))*U*2.5,U*8); c.globalAlpha=1; }

/* ---------- Hauptschleife ---------- */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>.05) dt=.05; if(dt<0) dt=0; T+=dt;
  try{
    Mu.set(cur.theme?cur.theme():'menu');
    checkHolds(dt); cur.update(dt,T); updateParts(dt); Vis.update(dt);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(FX.shake>.2){ ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.translate(rand(-1,1)*FX.shake,rand(-1,1)*FX.shake); FX.shake*=Math.pow(.004,dt); } else FX.shake=0;
    cur.draw(ctx,T); drawParts(ctx); if(cur.drawFront) cur.drawFront(ctx,T);
    Vis.draw(ctx,T); drawGlobal(ctx,T,dt); drawHint(ctx,T);
    if(FX.flash>0){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.globalAlpha=Math.min(1,FX.flash); ctx.fillStyle=FX.flashCol; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; FX.flash-=dt*2.2; }
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
resize(); cur=worlds.menu; cur.enter(); requestAnimationFrame(frame);
